# ─────────────────────────────────────────────────────────────
#  aivillage configuration
#  Copy this file to config.toml and edit what you like.
# ─────────────────────────────────────────────────────────────

[general]
language   = "en"        # en | de  (also switchable in-game with F2)
window_width  = 1440
window_height = 810
zoom       = 3           # integer world scale; bigger = closer
seed       = 1234
save_slot  = 1           # reserved; choose a slot in the F3 settings panel
photo_mode = false       # reserved: start with the UI hidden
seasonal_palette = true  # tint grass/trees by the real season

[reality]
# live  -> the village clock IS your clock
# fast  -> starts at your real time but runs ahead
time_mode        = "live"
latitude         = "auto"   # "auto" (IP based) or a number like 54.09
longitude        = "auto"
weather_enabled  = true
weather_refresh_s = 900
offline_weather  = "last_known"   # last_known | seasonal_sim
night_on_launch  = "live"         # live | skip_to_dawn

[llm]
# auto | ollama | openai | anthropic | openai_compatible
# claude_cli | codex_cli | subscription | mock | none
provider     = "auto"
model        = "llama3.2"
base_url     = ""            # e.g. http://localhost:11434 or your LM Studio url
api_key_env  = ""            # optional environment variable name, never the key itself
temperature  = 0.9
max_tokens   = 300
cache_entries = 256          # bounded in-memory exact-response cache; 0 disables
timeout_s    = 60
ambient_dialogue = true
parallel_ambient = true       # separate worker for background conversations
ambient_model = ""            # optional model ID just for background conversations
ambient_reasoning_effort = "low" # Codex conversations only; "" uses Codex's default

# Subscription connectors. These drive the official, already-logged-in CLIs
# (`claude -p` / `codex exec`); consumer subscriptions are not plain API keys.
#   provider = "subscription"  -> tries Claude first, then Codex
#   provider = "claude_cli"    -> Claude Code only
#   provider = "codex_cli"     -> Codex only
# Leave the commands empty to use whatever is on PATH.
claude_command   = "claude"
codex_command    = "codex"
prefer_subscription = false # with provider="auto": try a signed-in CLI before API keys
cli_model        = ""        # optional model for the CLI, e.g. "sonnet" or "gpt-5"
cli_timeout_s    = 120

# Villagers deciding for themselves: new trade, ambition, bio, quirk, hat, outfit.
# Runs only with a real provider (never with mock). Press R in-game to ask now.
self_directed   = true
self_interval_s = 180
self_failure_backoff_max_s = 1800 # cap automatic retries after provider errors

[voice]
enabled       = true
speak_ambient = true       # speak villagers' free-time conversations aloud
volume        = 0.85
rate_scale    = 1.0

[social]
ambient_budget_s = 45      # minimum seconds between auto conversations
failure_backoff_s = 120     # initial retry delay after failed ambient generation
failure_backoff_max_s = 900 # maximum retry delay
work_chatter     = false   # tiny one-liners during work hours
group_chats      = true    # allow ambient group conversations
group_chance     = 0.35
threads          = true    # include saved player and villager conversation histories
story_arcs       = true    # allow the LLM to develop a saved story on a new day

[news]
enabled  = true
poll_minutes = 40
max_dispatches_per_day = 2
tone     = "neutral"       # neutral | wholesome | strange_only
mute_after_failures = 5    # stop hammering a dead feed
backoff_base_s = 300
backoff_max_s  = 21600
alerts_enabled = true      # Bright Sky alert couriers; not an emergency warning system
alert_poll_minutes = 20
# category weights used when choosing which story reaches the village
[news.weights]
world   = 0.40
odd     = 0.15
science = 0.15
tech    = 0.10
sport   = 0.10
local   = 0.10

[visitors]
enabled = true
arrivals_per_day = 3
stay_minutes = 45
