name: Build desktop apps

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            installer_extension: exe
          - os: macos-latest
            installer_extension: dmg
          - os: ubuntu-22.04
            installer_extension: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build on target operating system
        run: python build_app.py --install
      - name: Archive standalone app (preserve executable permissions and links)
        run: python -c "import tarfile; t=tarfile.open('aivillage-${{ runner.os }}-${{ runner.arch }}.tar.gz','w:gz'); t.add('dist', arcname='dist'); t.close()"
      - name: Upload standalone app
        uses: actions/upload-artifact@v4
        with:
          name: aivillage-app-${{ runner.os }}-${{ runner.arch }}
          path: aivillage-${{ runner.os }}-${{ runner.arch }}.tar.gz
          if-no-files-found: error
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install macOS disk image builder
        if: runner.os == 'macOS'
        run: python -m pip install "dmgbuild>=1.6.5,<2"
      - name: Check Debian packaging tools
        if: runner.os == 'Linux'
        run: dpkg-deb --version
      - name: Build native installer
        run: python build_installer.py
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        run: python -c "from pathlib import Path; files=list(Path('dist/installers').glob('*.exe')); assert len(files)==1 and files[0].open('rb').read(2)==b'MZ', 'Missing or invalid Windows installer'"
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil imageinfo dist/installers/*.dmg
      - name: Verify Debian package
        if: runner.os == 'Linux'
        run: dpkg-deb --info dist/installers/*.deb
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: aivillage-installer-${{ runner.os }}-${{ runner.arch }}
          path: dist/installers/*.${{ matrix.installer_extension }}
          if-no-files-found: error
